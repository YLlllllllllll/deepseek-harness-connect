<!doctype html>
<html lang="zh-CN"><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; connect-src 'none'">
<title>远程服务器</title>
<style>
*{box-sizing:border-box}body{font:15px -apple-system,BlinkMacSystemFont,sans-serif;color:#192330;background:#f6f7f9;padding:24px;margin:0}h1{font-size:24px;margin:0 0 10px}h2{font-size:17px}p,small{color:#596879;line-height:1.5}label{display:block;margin:12px 0 5px}input,select{font:inherit;width:100%;padding:9px;border:1px solid #ccd4df;border-radius:7px;background:white}button{font:inherit;padding:9px 15px;border-radius:7px;border:1px solid #cbd3df;background:white;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.primary{background:#2563eb;color:white;border:0}form,.card{background:white;padding:18px;border:1px solid #dce2eb;border-radius:10px;margin-top:12px}.row{display:grid;grid-template-columns:1fr 120px;gap:14px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}#status{white-space:pre-wrap;padding:10px 0;color:#22539f}#status.error{color:#ad2323}.card p{margin:7px 0}small{display:block;margin-top:8px}section{margin-top:22px}
</style>
<h1>远程服务器</h1>
<p>添加 SSH 连接，再选择远程项目目录。支持多个服务器。</p>
<div id="status" role="status" aria-live="polite"></div>
<form id="server-form">
  <h2 id="form-title">添加服务器</h2>
  <label for="name">连接名称</label><input id="name" placeholder="例如：开发机" maxlength="200">
  <div class="row"><div><label for="host">SSH 地址</label><input id="host" placeholder="hostname 或 IP，不带 ssh://" required maxlength="1000"></div><div><label for="port">端口</label><input id="port" type="number" min="1" max="65535" value="22" required></div></div>
  <label for="user">用户名</label><input id="user" autocomplete="username" required maxlength="200">
  <label for="auth">登录方式</label><select id="auth"><option value="password">密码</option><option value="key">私钥 / SSH agent</option></select>
  <div id="password-row"><label for="password">密码</label><input id="password" type="password" autocomplete="off"><small>编辑已有连接时，留空保留原密码。密码由 SSH 插件保存在本机配置中。</small></div>
  <div id="key-row" hidden><label for="keyPath">私钥路径</label><input id="keyPath" placeholder="~/.ssh/id_ed25519；使用 SSH agent 时可留空"></div>
  <label for="remoteRoot">远程项目目录</label><input id="remoteRoot" value="~" required>
  <details><summary>跳板机（可选）</summary><label for="proxyJump">ProxyJump</label><input id="proxyJump" placeholder="user@bastion:22"></details>
  <div class="actions"><button class="primary" id="save">保存服务器</button><button type="button" id="new-connection">新增连接</button></div>
</form>
<section><h2>已保存的服务器</h2><div id="servers">正在读取…</div></section>
<script src="servers.cjs"></script>
</html>
